<!DOCTYPE html>
<html lang="en" dir="ltr" translate="yes">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{{TITLE}}</title>
    <meta content="{{DESC}}" name="description">
    <meta content="English" name="language">
    <meta content="en" http-equiv="content-language">
    <meta content="#210B36" name="theme-color">
    <meta property="og:site_name" content="Maison Asili">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_GB">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESC}}">
    <meta name="twitter:card" content="summary_large_image">
    <link href="{{BASE}}assets/css/fonts.css" rel="stylesheet">
    <link href="{{BASE}}assets/css/styles.css" rel="stylesheet">
    <link href="{{BASE}}assets/img/placeholder.svg" rel="icon" type="image/svg+xml">

<body class="bg-background text-on-surface font-body antialiased selection:bg-tertiary-container selection:text-on-surface"

    {{CONTENT}}
    {{FOOTER}}
    {{OVERLAYS}}

</html>
